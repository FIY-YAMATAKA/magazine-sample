<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Piglife TIMES</title>
		<link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Kosugi+Maru&family=M+PLUS+1p&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<link rel="stylesheet" href="../css/common.css" />
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<header>
			<h1><a href="../" title="Piglife TIMES - トップページ">Piglife TIMES</a></h1>
			<button class="menu-toggle" aria-label="メニューを開く"><i class="material-icons active">menu</i><i class="material-icons">close</i></button>
			<nav class="nav-menu">
				<ul>
					<li><a href="../">トップ</a></li>
					<li><a href="../topics">記事一覧</a></li>
					<li><span>お問い合わせ</span></li>
				</ul>
			</nav>
		</header>
		<main>
			<div class="form-body">
				<h2 class="section-title">
					<i class="material-icons" aria-hidden="false">mail</i>
					お問い合わせ
				</h2>
				<form id="contact" action="#" method="post">
					<div class="form-row">
						<label for="name">お名前</label>
						<input type="text" id="name" name="name" required />
					</div>
					<div class="form-row">
						<label for="email">メールアドレス</label>
						<input type="email" id="email" name="email" required />
					</div>
					<div class="form-row">
						<label for="message">お問い合わせ内容</label>
						<textarea id="message" name="message" rows="6" required></textarea>
					</div>
					<div class="form-btns">
						<button type="submit">送信</button>
						<button type="reset">リセット</button>
					</div>
				</form>
				<div id="sending">
					<h3>送信中です</h3>
					<div class="dot-loader">
						<div></div>
						<div></div>
						<div></div>
					</div>
				</div>
				<div id="sended">
					<h3>送信完了</h3>
					<p><i class="material-icons" aria-hidden="true">check_circle</i></p>
				</div>
			</div>
		</main>
		<footer>&copy; Takashi YAMAMOTO @ FIY CORPORATION</footer>
		<script src="../js/common.js"></script>
		<script src="js/script.js"></script>
	</body>
</html>
